<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker — CookSmart</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/budget.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">🍳 CookSmart</div>
        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="fridge.html">🧊 Fridge</a>
            <a href="budget.html">💰 Budget</a>
            <a href="profile.html">👤 Profile</a>
            <a href="contact.html">📬 Contact</a>
        </div>
        <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    </nav>


    <!-- PAGE -->
    <div class="page">

        <h1 class="page-title">💰 Budget Tracker</h1>


        <!-- SET MONTHLY BUDGET -->
        <div class="card" style="margin-bottom: 24px;">
            <h2 class="form-title">Set Monthly Budget</h2>
            <div class="budget-set-row">
                <span>₹</span>
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="eg: 3000"
                    min="0"
                />
                <button class="btn btn-primary"
                    onclick="setMonthlyBudget()">
                    Set Budget
                </button>
            </div>
        </div>


        <!-- BUDGET OVERVIEW -->
        <div class="budget-overview">

            <div class="budget-stat">
                <span class="amount" id="totalBudget">₹0</span>
                <span class="label">Monthly Budget</span>
            </div>

            <div class="budget-stat">
                <span class="amount spent" id="totalSpent">₹0</span>
                <span class="label">Total Spent</span>
            </div>

            <div class="budget-stat">
                <span class="amount remaining" id="totalRemaining">₹0</span>
                <span class="label">Remaining</span>
            </div>

        </div>


        <!-- BUDGET PROGRESS BAR -->
        <div class="budget-progress-card">
            <div class="progress-label">
                <span id="progressText">0% of budget used</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-wrap" style="margin-top: 10px;">
                <div class="progress-fill" id="budgetBar"
                    style="width: 0%">
                </div>
            </div>
        </div>


        <!-- ADD EXPENSE MANUALLY -->
        <div class="card" style="margin-bottom: 24px;">
            <h2 class="form-title">Add Expense</h2>
            <div class="add-expense-form">

                <div class="form-group">
                    <label>Dish Name</label>
                    <input
                        type="text"
                        id="expenseDish"
                        placeholder="eg: Dal Rice"
                    />
                </div>

                <div class="form-group">
                    <label>Amount Spent</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="eg: 150"
                        min="0"
                    />
                </div>

                <button class="btn btn-primary"
                    onclick="addExpense()">
                    + Add
                </button>

            </div>
        </div>


        <!-- SPENDING HISTORY -->
        <h2 class="section-heading">Spending History</h2>

        <div id="historyList">
            <div class="empty-state">
                <div class="icon">💰</div>
                <h3>No expenses yet</h3>
                <p>Start cooking to track your spending</p>
            </div>
        </div>


    </div>


    <!-- FOOTER -->
    <footer class="footer">
        🍳 CookSmart — Made for Students
    </footer>


    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/budget.js"></script>

</body>
</html>
