<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — CookSmart</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">🍳 CookSmart</div>
        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="fridge.html">🧊 Fridge</a>
            <a href="budget.html">💰 Budget</a>
            <a href="profile.html">👤 Profile</a>
            <a href="contact.html">📬 Contact</a>
        </div>
        <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    </nav>


    <!-- PAGE -->
    <div class="page">

        <!-- PROFILE HEADER -->
        <div class="profile-header">
            <div class="profile-avatar">👨‍🍳</div>
            <div class="profile-name" id="profileName">
                Student
            </div>
            <div class="profile-title" id="profileTitle">
                Beginner Cook
            </div>

            <!-- Edit Name -->
            <div class="edit-name-row">
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                />
                <button onclick="saveName()">Save</button>
            </div>
        </div>


        <!-- STATS -->
        <div class="profile-stats">

            <div class="profile-stat">
                <span class="value" id="statDishes">0</span>
                <span class="label">Dishes Cooked</span>
            </div>

            <div class="profile-stat">
                <span class="value" id="statStreak">0🔥</span>
                <span class="label">Day Streak</span>
            </div>

            <div class="profile-stat">
                <span class="value" id="statSaved">₹0</span>
                <span class="label">Saved Recipes</span>
            </div>

        </div>


        <!-- ACHIEVEMENTS -->
        <h2 class="section-heading">🏅 Achievements</h2>

        <div class="achievements-grid" id="achievementsGrid">
            <!-- Loads from JS -->
        </div>


        <!-- SAVED COOKBOOK -->
        <h2 class="section-heading" style="margin-top: 32px;">
            ❤️ My Cookbook
        </h2>

        <div id="cookbookList">
            <!-- Loads from JS -->
        </div>


        <!-- DIETARY PREFERENCES -->
        <h2 class="section-heading" style="margin-top: 32px;">
            ⚙️ Dietary Preferences
        </h2>

        <div class="card">
            <div class="pref-group">

                <label class="pref-option">
                    <input type="checkbox" id="prefVeg"
                        onchange="savePreferences()"/>
                    🌱 Vegetarian Only
                </label>

                <label class="pref-option">
                    <input type="checkbox" id="prefVegan"
                        onchange="savePreferences()"/>
                    🌿 Vegan Only
                </label>

                <label class="pref-option">
                    <input type="checkbox" id="prefGluten"
                        onchange="savePreferences()"/>
                    🌾 Gluten Free
                </label>

                <label class="pref-option">
                    <input type="checkbox" id="prefDairy"
                        onchange="savePreferences()"/>
                    🥛 Dairy Free
                </label>

            </div>
        </div>


        <!-- RESET BUTTON -->
        <button
            class="btn btn-danger"
            style="margin-top: 32px; width: 100%;"
            onclick="resetAll()">
            🗑️ Reset All Data
        </button>


    </div>


    <!-- FOOTER -->
    <footer class="footer">
        🍳 CookSmart — Made for Students
    </footer>


    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>

</body>
</html>
